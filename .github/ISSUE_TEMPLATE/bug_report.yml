name: Bug report
description: Report a reproducible editor or MCP problem
body:
  - type: input
    id: version
    attributes:
      label: SpriteLab version and operating system
    validations:
      required: true
  - type: dropdown
    id: adapter
    attributes:
      label: Where did it happen?
      options:
        - Desktop
        - MCP live
        - MCP headless
        - CLI / Python
  - type: textarea
    id: reproduce
    attributes:
      label: Steps, expected result and actual result
      description: Include a minimal project if possible. Remove personal paths and sensitive content from logs.
    validations:
      required: true
