name: macos-preview-package
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
        working-directory: apps/desktop
      - run: ./scripts/package-preview.sh
      - uses: actions/upload-artifact@v4
        with:
          name: spritelab-macos-arm64-preview
          path: |
            outputs/*preview-macOS-arm64.zip
            outputs/*SHA256SUMS.txt
          if-no-files-found: error
