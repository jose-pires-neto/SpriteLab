name: preview-validation
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  headless:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: cargo fmt --all --check
      - run: cargo clippy -p assetforge-command -p spritelab-core -p spritelab-cli --all-targets --locked -- -D warnings
      - run: cargo test -p assetforge-command -p spritelab-core -p spritelab-cli --locked
      - run: cargo build -p spritelab-cli --locked
      - run: npm ci --ignore-scripts && npm test
        working-directory: adapters/mcp
      - run: target/debug/spritelab --workspace demo --catalog > /tmp/commands.json && diff -u docs/commands.json /tmp/commands.json
      - run: node --test scripts/configure-mcp.test.mjs
  desktop:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts && npm run build
        working-directory: apps/desktop
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo build --locked
