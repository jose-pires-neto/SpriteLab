[workspace]
members = ["crates/assetforge-command", "crates/spritelab-core", "crates/spritelab-cli", "apps/desktop/src-tauri"]
resolver = "2"
[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"
[workspace.dependencies]
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
schemars = "0.8"
png = "0.17"
